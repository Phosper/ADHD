name: Baseline verification
on:
  push:
  pull_request:
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.11.21
      - run: uv sync --frozen
      - run: uv run python -m scripts.verify
      - run: uv run python -m scripts.export_contracts
      - run: git diff --exit-code -- contracts/
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci && npm run build && npx playwright install --with-deps chromium && npx playwright test
        working-directory: apps/web
