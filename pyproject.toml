[project]
name = "zhiyu-outbound"
version = "0.1.0"
description = "Auditable voice-agent baseline for the Zhiyu competition"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi==0.133.1",
  "pydantic==2.13.4",
  "uvicorn==0.41.0",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
]

[dependency-groups]
dev = ["pytest==8.3.4", "jsonschema==4.26.0", "ruff==0.15.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
extend-exclude = ["vendor", ".voice", ".core", ".models-env", "data", "runtime"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
